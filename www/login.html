<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>login test</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 16px; }
  .note { color: #555; font-size: 0.9em; }
  a { display: inline-block; margin-top: 16px; }
</style>
</head>
<body>
<h1>Login (POST /login)</h1>
<p class="note">Content-Type sent as <code>application/x-www-form-urlencoded</code>, matching what
<code>handlePOST</code> checks for. Correct credentials → 302 to <code>/</code> with a
<code>session_id</code> cookie set. Wrong credentials → 401.</p>

<form id="loginForm">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>

  <button type="submit">Log in</button>
</form>

<p id="status"></p>

<script>
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault(); // Stop the page from reloading

    // Convert the form data into URL-encoded format
    let formData = new FormData(this);
    let urlEncodedData = new URLSearchParams(formData);
    
    let statusText = document.getElementById("status");
    statusText.innerText = "Logging in...";
    statusText.style.color = "black";

    fetch("/login", {
      method: "POST",
      body: urlEncodedData,
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
      },
    })
      .then((response) => {
        if (response.status === 401) {
          statusText.innerText = "Error 401: Unauthorized (Invalid credentials)";
          statusText.style.color = "red";
        } else if (response.ok || response.redirected) {
          statusText.innerText = "Success! Logged in.";
          statusText.style.color = "green";
          // If you wanted to redirect them to the hub after a delay, you could do:
          // setTimeout(() => window.location.href = "/", 1000);
        } else {
          statusText.innerText = "Error: " + response.status;
          statusText.style.color = "red";
        }
      })
      .catch((error) => {
        statusText.innerText = "Login request failed.";
        statusText.style.color = "red";
      });
  });
</script>

<a href="/">&larr; back to hub</a>
</body>
</html>
