<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload &mdash; webserv</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html" data-auth="guest">Login</a>
    <a href="register.html" data-auth="guest">Register</a>
    <a href="upload.html" class="active">Upload</a>
    <a href="button.html">Test Actions</a>
    <a href="#" id="logoutLink" data-auth="user">Logout</a>
  </nav>
  <main>
    <div class="card">
      <h1>Upload a file</h1>
      <p class="sub">Sends a <code>multipart/form-data</code> POST to <code>/upload</code></p>

      <form id="uploadForm" method="POST" action="/upload" enctype="multipart/form-data">
        <label>File</label>
        <div class="file-drop" id="dropZone">
          Drag &amp; drop a file here, or click to browse
          <input type="file" id="fileInput" name="file" required>
        </div>
        <div id="fileName"></div>

        <button type="submit">Upload</button>
      </form>

      <div id="status" class="status"></div>
    </div>
  </main>
  <script src="auth.js"></script>
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const form = document.getElementById('uploadForm');
    const status = document.getElementById('status');

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        fileName.textContent = `Selected: ${fileInput.files[0].name} (${(fileInput.files[0].size / 1024).toFixed(1)} KB)`;
      }
    });

    ['dragenter', 'dragover'].forEach(evt => {
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.classList.add('drag');
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) {
        fileInput.files = files;
        fileName.textContent = `Selected: ${files[0].name} (${(files[0].size / 1024).toFixed(1)} KB)`;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!fileInput.files.length) {
        status.className = 'status show err';
        status.textContent = 'Please choose a file first.';
        return;
      }

      status.className = 'status show';
      status.textContent = 'Uploading...';

      const formData = new FormData(form);

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: formData
        });
        const text = await res.text();

        if (res.ok) {
          status.className = 'status show ok';
          status.textContent = `Success (${res.status}): ${text || 'File uploaded.'}`;
        } else {
          status.className = 'status show err';
          status.textContent = `Error (${res.status}): ${text || 'Upload failed.'}`;
        }
      } catch (err) {
        status.className = 'status show err';
        status.textContent = `Network error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
