<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>register test</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 16px; }
  .note { color: #555; font-size: 0.9em; }
  a { display: inline-block; margin-top: 16px; }
</style>
</head>
<body>
<h1>Register (POST /register)</h1>
<p class="note">New username → 302 to <code>/</code> with session cookie set.
Duplicate username → 409.</p>

<form id="registerForm">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>

  <button type="submit">Register</button>
</form>

<p id="status"></p>

<script>
  document.getElementById("registerForm").addEventListener("submit", function (e) {
    e.preventDefault(); // Stop the page from reloading

    // Convert the form data into URL-encoded format
    let formData = new FormData(this);
    let urlEncodedData = new URLSearchParams(formData);
    
    let statusText = document.getElementById("status");
    statusText.innerText = "Registering...";
    statusText.style.color = "black";

    fetch("/register", {
      method: "POST",
      body: urlEncodedData,
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
      },
    })
      .then((response) => {
        if (response.status === 409) {
          statusText.innerText = "Error 409: Conflict (Username already exists)";
          statusText.style.color = "red";
        } else if (response.ok || response.redirected) {
          statusText.innerText = "Success! Account registered.";
          statusText.style.color = "green";
        } else {
          statusText.innerText = "Error: " + response.status;
          statusText.style.color = "red";
        }
      })
      .catch((error) => {
        statusText.innerText = "Registration request failed.";
        statusText.style.color = "red";
      });
  });
</script>

<a href="/">&larr; back to hub</a>
</body>
</html>
