<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>414 URI Too Long · webserv</title>
<style>
  :root {
    --bg: #0c0e11;
    --panel: #101318;
    --line: #1f242c;
    --text: #e8e6e1;
    --dim: #6b7280;
    --dim2: #454b56;
    --cli: #ff8a3d;
    --srv: #e5484d;
    --ok: #3dd68c;
    --accent: var(--cli);
    --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-position: -1px -1px;
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.7);
  }
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.02em;
  }
  .titlebar .dots { display: flex; gap: 6px; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim2);
  }
  .body { padding: 40px 32px 32px; }
  .status-line {
    font-size: 12px;
    color: var(--dim);
    margin: 0 0 18px;
  }
  .status-line b { color: var(--accent); font-weight: 600; }
  .code {
    font-size: 88px;
    line-height: 1;
    font-weight: 700;
    color: var(--accent);
    margin: 0;
    letter-spacing: -0.02em;
  }
  .name {
    font-size: 20px;
    margin: 10px 0 18px;
    color: var(--text);
  }
  .desc {
    font-size: 14px;
    line-height: 1.6;
    color: #b7b4ad;
    margin: 0 0 26px;
    max-width: 46ch;
  }
  .log {
    font-size: 12px;
    color: var(--dim);
    background: #0a0c0f;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 28px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log .tag { color: var(--accent); }
  .prompt {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--dim);
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .prompt .path { color: var(--ok); }
  .prompt .sep { color: var(--dim2); }
  .cursor {
    display: inline-block;
    width: 7px; height: 14px;
    background: var(--text);
    animation: blink 1s steps(1) infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0; } }
  a.home {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }
  a.home:hover { opacity: 0.8; }
  @media (max-width: 480px) {
    .code { font-size: 64px; }
    .body { padding: 28px 20px 24px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="titlebar">
      <span>webserv/1.1</span>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div class="body">
      <p class="status-line">HTTP/1.1 <b>414</b> URI Too Long</p>
      <p class="code">414</p>
      <p class="name">URI Too Long</p>
      <p class="desc">The request URI is longer than this server allows.</p>
      <div class="log"><span class="tag">[webserv]</span> uri exceeds configured limit</div>
      <div class="prompt">
        <span class="path">~/webserv</span><span class="sep">$</span>
        <span>go back to <a class="home" href="/">/</a></span>
        <span class="cursor"></span>
      </div>
    </div>
  </div>
</body>
</html>
