<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CGI test page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #d7dde3; padding: 2rem; }
  h1 { color: #7ee787; }
  a.button, button { display: inline-block; background: #1f6feb; color: white; border: none;
    padding: 10px 18px; border-radius: 6px; text-decoration: none; font-size: 1rem; cursor: pointer; }
  form { margin-top: 1.5rem; }
  input[type=text] { padding: 8px; border-radius: 6px; border: 1px solid #333;
    background: #161b22; color: #d7dde3; margin-right: 8px; width: 260px; }
  .card { max-width: 560px; }
</style>
</head>
<body>
<div class="card">
  <h1>CGI test page</h1>
  <p>Both of these actually leave this page and load the CGI script's own response --
  that's the real request/response round trip through your server, not a simulation.</p>

  <p>
    <a class="button" href="/cgi-bin/hello.py?name=Rai">GET /cgi-bin/hello.py?name=Rai</a>
  </p>

  <form method="POST" action="/cgi-bin/hello.py">
    <input type="text" name="message" value="Hello from the form!">
    <button type="submit">POST /cgi-bin/hello.py</button>
  </form>
</div>
</body>
</html>
